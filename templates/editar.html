<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Evento - Em Movimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen p-6 md:p-10 flex items-center justify-center">
    
    <div class="w-full max-w-2xl bg-white/95 backdrop-blur-md p-8 rounded-[2rem] shadow-xl border border-slate-100 relative overflow-hidden">
        
        <h1 class="text-3xl font-extrabold text-slate-900 mb-6 border-b border-slate-100 pb-4">
            Editar <span class="text-orange-500">Evento</span>
        </h1>
        
        <form method="POST" action="/editar/{{ evento.id }}" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1">
                <label class="text-sm font-bold text-slate-700">Título:</label>
                <input type="text" name="titulo" value="{{ evento.titulo }}" required class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            
            <div class="flex flex-col gap-1">
                <label class="text-sm font-bold text-slate-700">Data (AAAA-MM-DD):</label>
                <input type="date" name="data" value="{{ evento.data }}" required class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            
            <div class="flex flex-col gap-1">
                <label class="text-sm font-bold text-slate-700">Cidade:</label>
                <input type="text" name="cidade" value="{{ evento.cidade }}" required class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            
            <div class="flex flex-col gap-1">
                <label class="text-sm font-bold text-slate-700">Distância (km):</label>
                <input type="text" name="distancia" value="{{ evento.distancia }}" required class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <!-- NOVO CAMPO: LINK DO MAPA -->
            <div class="flex flex-col gap-1">
                <label class="text-sm font-bold text-slate-700">Link da Rota (Google Maps):</label>
                <input type="url" name="link_mapa" value="{{ evento.link_mapa if evento.link_mapa else '' }}" placeholder="Cole o link do mapa aqui" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            
            <div class="flex gap-4 mt-4">
                <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
                    Salvar Alterações
                </button>
                <a href="/painel" class="flex-1 bg-slate-400 hover:bg-slate-500 text-white font-bold py-3 rounded-xl shadow-md transition text-center flex items-center justify-center text-sm">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

</body>
</html>
