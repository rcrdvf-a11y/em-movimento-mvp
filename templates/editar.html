<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Evento - Em Movimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-md border border-slate-100">
        <h2 class="text-2xl font-bold text-blue-600 border-b-2 border-blue-200 pb-2 mb-6">Editar Evento</h2>
        
        <form method="POST" action="/editar/{{ evento.id }}" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Título:</label>
                <input type="text" name="titulo" value="{{ evento.titulo }}" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Data (AAAA-MM-DD):</label>
                <!-- Alterado type para date para facilitar o preenchimento -->
                <input type="date" name="data" value="{{ evento.data }}" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Cidade:</label>
                <input type="text" name="cidade" value="{{ evento.cidade }}" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Distância (km):</label>
                <input type="text" name="distancia" value="{{ evento.distancia }}" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <!-- Botões dividindo o espaço igualmente -->
            <div class="flex gap-4 mt-4">
                <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-sm transition">
                    Salvar
                </button>
                <a href="/" class="w-1/2 bg-slate-400 hover:bg-slate-500 text-white font-bold py-3 rounded-lg text-center shadow-sm transition flex items-center justify-center">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

</body>
</html>
