<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Em Movimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Função simples para alternar entre os formulários de Login e Cadastro
        function alternarFormularios() {
            const formLogin = document.getElementById('seccao-login');
            const formCadastro = document.getElementById('seccao-cadastro');
            
            if (formLogin.classList.contains('hidden')) {
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
            } else {
                formLogin.classList.add('hidden');
                formCadastro.classList.remove('hidden');
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col relative overflow-hidden z-0">

    <!-- CABEÇALHO COM LOGO E ÍCONES -->
    <header class="w-full flex justify-between items-center p-6 md:p-10 relative z-10">
        <div>
            <img src="/static/img/bg-logo.png" alt="Logo Em Movimento" class="h-10 md:h-14 drop-shadow-md">
        </div>
        
        <div class="flex gap-4 items-center bg-white/50 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-slate-200">
            <a href="/">
                <img src="/static/img/bg-iconeHome.png" class="w-8 h-8 hover:scale-110 transition-transform" alt="Início">
            </a>
            <img src="/static/img/bg-iconeLogin.png" class="w-8 h-8 hover:scale-110 transition-transform" alt="Perfil">
        </div>
    </header>

    <!-- ÁREA CENTRAL -->
    <main class="flex-grow flex flex-col md:flex-row items-center justify-center gap-10 p-6 relative z-10 max-w-7xl mx-auto w-full pb-12">
        
        <!-- Lado Esquerdo: Texto + Ilustração -->
        <div class="text-center md:text-left md:w-1/2 flex flex-col items-center md:items-start mt-4 md:mt-0">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-slate-900 leading-tight mb-6">
                Se conecte com eventos ciclísticos.
            </h1>
            
            <!-- IMAGEM REPOSICIONADA AQUI -->
            <img src="/static/img/bg-login.png" alt="Ilustração Ciclistas" class="w-full max-w-lg object-contain mt-4 drop-shadow-md hover:-translate-y-1 transition-transform duration-300">
        </div>

        <!-- Lado Direito: Cartão Dinâmico -->
        <div class="w-full md:w-1/3 flex flex-col gap-6 mt-8 md:mt-0">
            
            <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100 w-full max-w-md mx-auto relative overflow-hidden">
                
                <div class="flex justify-center mb-6">
                    <img src="/static/img/bg-logo.png" alt="Logo Menor" class="h-6">
                </div>

                <!-- SECÇÃO DE LOGIN (Visível por defeito) -->
                <div id="seccao-login" class="block transition-all duration-300">
                    <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">Faça seu Login</h2>
                    
                    <form method="POST" action="/login" class="flex flex-col gap-4">
                        <input type="email" name="email_login" placeholder="E-mail" required class="w-full p-3 bg-slate-50 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <input type="password" name="senha_login" placeholder="Senha" required class="w-full p-3 bg-slate-50 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        
                        <button type="submit" class="w-2/3 mx-auto bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-full mt-2 shadow-md transition-colors text-sm">
                            Entrar
                        </button>
                    </form>

                    <div class="text-center mt-6 pt-4 border-t border-slate-100">
                        <p class="text-sm text-slate-500 font-medium mb-2">Ainda não tem conta?</p>
                        <button onclick="alternarFormularios()" class="text-green-600 font-bold hover:text-green-700 hover:underline transition-colors">
                            Cadastre-se já!
                        </button>
                    </div>
                </div>

                <!-- SECÇÃO DE REGISTO (Oculta por defeito) -->
                <div id="seccao-cadastro" class="hidden transition-all duration-300">
                    <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">Crie sua Conta</h2>
                    
                    <form method="POST" action="/cadastrar" class="flex flex-col gap-4">
                        <input type="text" name="nome" placeholder="Nome Completo" required class="w-full p-3 bg-slate-50 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <input type="email" name="email" placeholder="E-mail" required class="w-full p-3 bg-slate-50 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <input type="password" name="senha" placeholder="Senha" required class="w-full p-3 bg-slate-50 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        
                        <button type="submit" class="w-2/3 mx-auto bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-full mt-2 shadow-md transition-colors text-sm">
                            Registar
                        </button>
                    </form>

                    <div class="text-center mt-6 pt-4 border-t border-slate-100">
                        <p class="text-sm text-slate-500 font-medium mb-2">Já possui uma conta?</p>
                        <button onclick="alternarFormularios()" class="text-green-600 font-bold hover:text-green-700 hover:underline transition-colors">
                            Fazer Login
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
